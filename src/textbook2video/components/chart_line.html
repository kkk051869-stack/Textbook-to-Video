<!-- COMPONENT: chart-line — SVG 折线图/曲线图
     结构框架，LLM 根据 storyboard 填充数据。
     可调整：标题、轴标签、曲线数据点、标注文字。
     视觉标杆：stroke-dashoffset 绘制动画 + 毛玻璃容器 + 渐变曲线
-->
<div class="chart-container anim anim-up d2">
    <h3 style="text-align:center;font-size:22px;font-weight:800;color:var(--text);margin-bottom:16px;letter-spacing:2px;">
        [图表标题]
    </h3>
    <svg viewBox="0 0 700 400" style="width:100%;height:auto;" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="var(--primary)" stop-opacity="0.25"/>
                <stop offset="100%" stop-color="var(--primary)" stop-opacity="0.02"/>
            </linearGradient>
            <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%"   stop-color="var(--primary)"/>
                <stop offset="50%"  stop-color="var(--secondary)"/>
                <stop offset="100%" stop-color="var(--accent)"/>
            </linearGradient>
        </defs>

        <!-- 网格线（水平） -->
        <g stroke="rgba(100,116,139,0.08)" stroke-width="1" stroke-dasharray="4 4">
            <line x1="80" y1="100" x2="660" y2="100"/>
            <line x1="80" y1="160" x2="660" y2="160"/>
            <line x1="80" y1="220" x2="660" y2="220"/>
            <line x1="80" y1="280" x2="660" y2="280"/>
        </g>

        <!-- 坐标轴 -->
        <line x1="80" y1="40"  x2="80"  y2="340" stroke="rgba(100,116,139,0.15)" stroke-width="1"/>
        <line x1="80" y1="340" x2="660" y2="340" stroke="rgba(100,116,139,0.15)" stroke-width="1"/>

        <!-- Y 轴标签 -->
        <text x="70" y="344" font-size="12" fill="var(--text-dim)" text-anchor="end">[Y0]</text>
        <text x="70" y="284" font-size="12" fill="var(--text-dim)" text-anchor="end">[Y1]</text>
        <text x="70" y="224" font-size="12" fill="var(--text-dim)" text-anchor="end">[Y2]</text>
        <text x="70" y="164" font-size="12" fill="var(--text-dim)" text-anchor="end">[Y3]</text>
        <text x="70" y="104" font-size="12" fill="var(--text-dim)" text-anchor="end">[Y4]</text>
        <text x="70" y="48"  font-size="12" fill="var(--text-dim)" text-anchor="end">[Y5]</text>

        <!-- X 轴标签 -->
        <text x="120" y="365" font-size="12" fill="var(--text-dim)" text-anchor="middle">[X0]</text>
        <text x="240" y="365" font-size="12" fill="var(--text-dim)" text-anchor="middle">[X1]</text>
        <text x="360" y="365" font-size="12" fill="var(--text-dim)" text-anchor="middle">[X2]</text>
        <text x="480" y="365" font-size="12" fill="var(--text-dim)" text-anchor="middle">[X3]</text>
        <text x="600" y="365" font-size="12" fill="var(--text-dim)" text-anchor="middle">[X4]</text>

        <!-- 轴标题 -->
        <text x="370" y="392" font-size="14" fill="var(--text-dim)" text-anchor="middle" font-weight="600" letter-spacing="2">[X轴名称]</text>
        <text x="24" y="190" font-size="14" fill="var(--text-dim)" text-anchor="middle" font-weight="600" letter-spacing="2"
              transform="rotate(-90, 24, 190)">[Y轴名称]</text>

        <!-- 渐变填充区域 -->
        <!-- [LLM: 根据数据生成 path d] -->
        <path d="M120,280 C200,200 280,140 360,110 C440,90 520,85 600,82 L600,340 L120,340 Z"
              fill="url(#areaGrad)"/>

        <!-- 主曲线（drawLine 动画） -->
        <!-- [LLM: 根据数据生成 path d，保持与填充区域一致] -->
        <path d="M120,280 C200,200 280,140 360,110 C440,90 520,85 600,82"
              stroke="url(#lineGrad)" stroke-width="3" fill="none" stroke-linecap="round"
              stroke-dasharray="1200" stroke-dashoffset="1200"
              style="transition: stroke-dashoffset 3s cubic-bezier(0.4,0,0.2,1);"/>
        <!-- 注意：shell.html 里的 SlideController 会在 slide.active 时通过 CSS 触发，
             但这个 path 不在 .slide.active 选择器里，LLM 需要用 class="curve-main-path"
             或改用 animation: drawLine 3s ease forwards; -->

        <!-- 数据点 -->
        <circle cx="120" cy="280" r="5" fill="var(--primary)"   opacity="0" style="animation: bounceIn 0.5s ease forwards 0.5s;"/>
        <circle cx="240" cy="175" r="5" fill="var(--primary)"   opacity="0" style="animation: bounceIn 0.5s ease forwards 1.0s;"/>
        <circle cx="360" cy="110" r="5" fill="var(--secondary)" opacity="0" style="animation: bounceIn 0.5s ease forwards 1.5s;"/>
        <circle cx="480" cy="90"  r="5" fill="var(--secondary)" opacity="0" style="animation: bounceIn 0.5s ease forwards 2.0s;"/>
        <circle cx="600" cy="82"  r="5" fill="var(--accent)"    opacity="0" style="animation: bounceIn 0.5s ease forwards 2.5s;"/>

        <!-- 标注框（可选，LLM 根据需要添加） -->
        <rect x="350" y="55" width="160" height="28" rx="8"
              fill="rgba(67,97,238,0.08)" stroke="var(--border)" stroke-width="1"/>
        <text x="430" y="74" font-size="12" fill="var(--primary)" text-anchor="middle" font-weight="600">[标注文字]</text>
    </svg>
</div>
