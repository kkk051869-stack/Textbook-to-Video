<!-- EXAMPLE: title 页 — 标题+副标题+装饰 SVG -->
<div class="slide active">
  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;padding:60px 48px;">
    <div class="anim anim-anticipate-up d1" style="font-size:52px;font-weight:900;color:var(--text);letter-spacing:3px;">
      深度学习基础
    </div>
    <div class="anim anim-up d3" style="font-size:22px;color:var(--text-dim);margin-top:16px;">
      从感知机到反向传播
    </div>
    <svg viewBox="0 0 200 200" width="120" height="120" style="margin-top:32px;" class="anim anim-scale d5">
      <circle cx="100" cy="100" r="80" fill="none" stroke="var(--primary)" stroke-width="4"
              class="svg-draw" style="--path-length:503"/>
      <path d="M60,100 Q100,50 140,100 Q100,150 60,100" fill="none"
            stroke="var(--accent)" stroke-width="3"
            class="svg-draw svg-draw-slow" style="--path-length:220"/>
    </svg>
    <div class="anim-float" style="position:absolute;top:80px;right:120px;font-size:32px;opacity:0.6;">🧠</div>
    <div class="anim-sparkle" style="position:absolute;bottom:100px;left:140px;font-size:28px;">✨</div>
  </div>
</div>
