<!-- EXAMPLE: data-chart 页 — SVG曲线图+描边动画 -->
<div class="slide">
  <div class="chart-container anim anim-up d1" style="padding:32px;">
    <h3 class="anim anim-anticipate-up d1" style="text-align:center;font-size:22px;font-weight:800;color:var(--text);margin-bottom:16px;">
      训练损失曲线
    </h3>
    <svg viewBox="0 0 700 350" style="width:100%;height:auto;">
      <defs>
        <linearGradient id="areaG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--primary)" stop-opacity="0.2"/>
          <stop offset="100%" stop-color="var(--primary)" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <!-- 网格 -->
      <g stroke="rgba(100,116,139,0.08)" stroke-width="1" stroke-dasharray="4 4">
        <line x1="80" y1="80" x2="650" y2="80"/>
        <line x1="80" y1="160" x2="650" y2="160"/>
        <line x1="80" y1="240" x2="650" y2="240"/>
      </g>
      <!-- 坐标轴 -->
      <line x1="80" y1="40" x2="80" y2="300" stroke="rgba(100,116,139,0.15)" stroke-width="1"/>
      <line x1="80" y1="300" x2="650" y2="300" stroke="rgba(100,116,139,0.15)" stroke-width="1"/>
      <!-- 轴标签 -->
      <text x="70" y="84" font-size="11" fill="var(--text-dim)" text-anchor="end">1.0</text>
      <text x="70" y="164" font-size="11" fill="var(--text-dim)" text-anchor="end">0.6</text>
      <text x="70" y="244" font-size="11" fill="var(--text-dim)" text-anchor="end">0.2</text>
      <text x="365" y="330" font-size="13" fill="var(--text-dim)" text-anchor="middle">Epoch</text>
      <!-- 渐变填充 -->
      <path d="M80,80 C200,100 350,200 500,260 C580,280 630,285 650,288 L650,300 L80,300 Z"
            fill="url(#areaG)"/>
      <!-- 主曲线 — SVG 描边动画 -->
      <path d="M80,80 C200,100 350,200 500,260 C580,280 630,285 650,288"
            class="svg-draw" style="--path-length:750"
            stroke="var(--primary)" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- 数据点 -->
      <circle cx="80" cy="80" r="5" fill="var(--primary)" class="anim anim-icon" data-step="1"/>
      <circle cx="270" cy="155" r="5" fill="var(--primary)" class="anim anim-icon" data-step="1"/>
      <circle cx="500" cy="260" r="5" fill="var(--secondary)" class="anim anim-icon" data-step="2"/>
      <circle cx="650" cy="288" r="5" fill="var(--accent)" class="anim anim-icon" data-step="2"/>
    </svg>
  </div>
</div>
