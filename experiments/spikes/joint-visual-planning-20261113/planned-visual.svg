<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="754" viewBox="0 0 1600 754" role="img" data-renderer="teaching-visual-v2" data-theme="bright" data-auto-layout="horizontal"><title>UTXO交易流转</title><defs><marker id="grammar-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#8b5cf6" stroke-width="1.5" /></marker></defs><style>text{font-family:Microsoft YaHei,PingFang SC,sans-serif;white-space:pre}</style><path data-edge="input_to_tx" d="M385,281.39 L645,318.11" fill="none" stroke="#8b5cf6" stroke-width="3" marker-end="url(#grammar-arrow)" data-relationship-id="input_to_tx" /><path data-edge="input2_to_tx" d="M385,398.61 L645,361.89" fill="none" stroke="#8b5cf6" stroke-width="3" marker-end="url(#grammar-arrow)" data-relationship-id="input2_to_tx" /><path data-edge="tx_to_receiver" d="M955,312.943 L1215,267.557" fill="none" stroke="#8b5cf6" stroke-width="3" marker-end="url(#grammar-arrow)" data-relationship-id="tx_to_receiver" /><path data-edge="tx_to_change" d="M955,367.057 L1215,412.443" fill="none" stroke="#8b5cf6" stroke-width="3" marker-end="url(#grammar-arrow)" data-relationship-id="tx_to_change" /><g data-edge-label="input_utxo_1:transaction"><rect x="415" y="278.75" width="200" height="42" rx="16" fill="white" stroke="white" stroke-opacity=".5" /><text x="515" y="305.75" font-size="23" text-anchor="middle" fill="#f97316">作为输入</text></g><g data-edge-label="input_utxo_2:transaction"><rect x="415" y="359.25" width="200" height="42" rx="16" fill="white" stroke="white" stroke-opacity=".5" /><text x="515" y="386.25" font-size="23" text-anchor="middle" fill="#f97316">作为输入</text></g><g data-edge-label="transaction:output_utxo_receiver"><rect x="985" y="269.25" width="200" height="42" rx="16" fill="white" stroke="white" stroke-opacity=".5" /><text x="1085" y="296.25" font-size="23" text-anchor="middle" fill="#f97316">生成输出</text></g><g data-edge-label="transaction:output_utxo_change"><rect x="985" y="368.75" width="200" height="42" rx="16" fill="white" stroke="white" stroke-opacity=".5" /><text x="1085" y="395.75" font-size="23" text-anchor="middle" fill="#f97316">生成找零</text></g><g data-node-id="input_utxo_1" data-detail-font-size="24"><rect x="75" y="204" width="310" height="111" rx="16" fill="white" stroke="#8b5cf6" stroke-opacity=".5" /><text x="95" y="242" font-size="29" text-anchor="start" fill="#1e293b">输入UTXO 1</text><text x="95" y="284.7" font-size="24" text-anchor="start" fill="#64748b">0.5 BTC</text></g><g data-node-id="input_utxo_2" data-detail-font-size="24"><rect x="75" y="365" width="310" height="111" rx="16" fill="white" stroke="#8b5cf6" stroke-opacity=".5" /><text x="95" y="403" font-size="29" text-anchor="start" fill="#1e293b">输入UTXO 2</text><text x="95" y="445.7" font-size="24" text-anchor="start" fill="#64748b">0.3 BTC</text></g><g data-node-id="transaction" data-detail-font-size="24"><rect x="645" y="284.5" width="310" height="111" rx="16" fill="white" stroke="#8b5cf6" stroke-opacity=".5" /><text x="665" y="322.5" font-size="29" text-anchor="start" fill="#1e293b">交易</text><text x="665" y="365.2" font-size="24" text-anchor="start" fill="#64748b">支付0.6 BTC</text></g><g data-node-id="output_utxo_receiver" data-detail-font-size="24"><rect x="1215" y="166" width="310" height="149" rx="16" fill="white" stroke="#8b5cf6" stroke-opacity=".5" /><text x="1235" y="204" font-size="29" text-anchor="start" fill="#1e293b">输出UTXO (接</text><text x="1235" y="241.7" font-size="29" text-anchor="start" fill="#1e293b">收者)</text><text x="1235" y="284.4" font-size="24" text-anchor="start" fill="#64748b">0.6 BTC</text></g><g data-node-id="output_utxo_change" data-detail-font-size="24"><rect x="1215" y="365" width="310" height="149" rx="16" fill="white" stroke="#8b5cf6" stroke-opacity=".5" /><text x="1235" y="403" font-size="29" text-anchor="start" fill="#1e293b">输出UTXO (找</text><text x="1235" y="440.7" font-size="29" text-anchor="start" fill=