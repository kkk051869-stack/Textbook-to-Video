[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "textbook2video"
version = "0.1.0"
description = "中小学 AI 教育教材 → 带动画配音的教学视频"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "playwright>=1.40",
    "edge-tts>=6.1",
    "litellm>=1.30",
    "python-dotenv>=1.0",
    "PyMuPDF>=1.24",
    "python-docx>=1.1",
    "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.scripts]
t2v = "textbook2video.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
